[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-agent"
version = "0.4.0"
description = "Read-only Google Classroom foundation"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=6.19,<7", "reportlab>=4.2,<5", "defusedxml>=0.7,<1", "requests>=2.33,<3",
  "sqlalchemy>=2.0,<3",
  "google-api-python-client>=2.150,<3", "google-auth>=2.35,<3",
  "google-auth-oauthlib>=1.2,<2", "google-auth-httplib2>=0.2,<1",
  "httplib2>=0.22,<1", "pydantic>=2.9,<3", "python-dotenv>=1,<2",
  "typer>=0.15,<1", "rich>=13.9,<15", "tzdata>=2024.2", "oauthlib>=3.2,<4",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "starlette>=1.6,<2",
  "markdown-it-py>=3,<5", "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-defusedxml", "types-requests", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "main.py"]
exclude = ["^build/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["google.*", "google_auth_oauthlib.*", "google_auth_httplib2.*", "googleapiclient.*", "httplib2.*", "oauthlib.*", "requests_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
